<body>
  <a class="skip-link" href="#feed">Skip to posts</a>
  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <nav class="toolbar-navigation" aria-label="Site navigation">
        <a class="control-button wordmark" href="./" aria-label="Archie home" title="Archie home">
          <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><use href="Buttons/icons.svg#archie"/></svg>
          <span class="control-label">archie<span class="wordmark-dot">.</span></span>
        </a>
        <a class="control-button control-panel-button" href="Sites/ControlPanel.html" aria-label="Control Panel" title="Control Panel">
          <svg class="tools-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><use class="tool-heads" href="Buttons/icons.svg?v=tools-highlight-20261029#tools-heads"/><use href="Buttons/icons.svg?v=tools-highlight-20261029#tools"/></svg>
          <span class="control-label">Control Panel</span>
        </a>
        <a class="control-button help-button" href="Sites/help.html" aria-label="Help" title="Help">
          <!-- An original question-mark beacon in an angular energy frame. -->
          <svg class="help-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><use class="help-frame" href="Buttons/icons.svg#help-frame"/><use class="help-question" href="Buttons/icons.svg#help-question"/><use class="help-dot" href="Buttons/icons.svg#help-dot"/></svg>
          <span class="control-label">Help</span>
        </a>
      </nav>
      <div class="toolbar-actions">
        <button class="control-button interaction-button" id="interact" type="button" aria-controls="feed" aria-pressed="false" aria-label="Interact with posts" title="Interact with posts" disabled>
          <!-- An original energy-shield icon, inspired by Protoss shields. -->
          <svg class="shield-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><use class="shield-outline" href="Buttons/icons.svg#shield-outline"/><use class="shield-core" href="Buttons/icons.svg#shield-core"/><use href="Buttons/icons.svg#shield-detail"/></svg>
          <span class="control-label">Interact</span>
        </button>
        <button class="control-button shuffle-button" id="shuffle" type="button" aria-label="Shuffle" aria-controls="feed quote" disabled>
          <!-- An original warp-crystal icon, inspired by StarCraft's blue light. -->
          <svg class="warp-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true"><use class="warp-orbit" href="Buttons/icons.svg#warp-orbit"/><use class="warp-crystal" href="Buttons/icons.svg#warp-crystal"/><use href="Buttons/icons.svg#warp-detail"/></svg>
          <span class="control-label">Shuffle</span>
        </button>
      </div>
    </div>
  </header>

  <main class="demo">
    <section class="intro" id="quote" aria-label="Quote" aria-live="polite" aria-atomic="true" hidden>
      <p class="eyebrow"><span aria-hidden="true"></span><span id="quote-author"></span></p>
      <p class="description" id="quote-text"></p>
    </section>

    <p class="feed-message" id="feed-message" role="status">Gathering the posts…</p>
    <p class="sr-only" id="interaction-hint">Enable “Interact with posts” in the toolbar to use post links and videos.</p>
    <ul class="card-stage" id="feed" role="list" data-interactive="false" aria-label="Posts from across your networks" aria-describedby="interaction-hint" aria-busy="true" tabindex="-1"></ul>
    <p class="sr-only" id="shuffle-status" role="status" aria-live="polite"></p>
    <noscript><p class="feed-message">Enable JavaScript to load the embedded posts.</p></noscript>
    <footer class="site-footer"><span class="footer-spark" aria-hidden="true">✧</span> Author: <a rel="me noopener noreferrer" target="_blank" href="https://mastodon.social/@gjorgji_vasileski">Gjorgji Vasileski🦣</a></footer>
  </main>

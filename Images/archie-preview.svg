<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Archie — A different perspective</title>
  <desc id="description">Archie's dark blue wordmark beside a screenshot of native social posts in the Archie feed. Posts worth keeping. A fresh view with every shuffle. aggregate.mk.</desc>
  <!-- Editable source for the social preview. Export at 1200 × 630 as PNG. -->
  <defs>
    <radialGradient id="ambient" cx="82%" cy="46%" r="70%">
      <stop stop-color="#245377" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#162e44" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0d141d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x2="0" y2="1">
      <stop stop-color="#c7d8e5"/>
      <stop offset="1" stop-color="#86a7be"/>
    </linearGradient>
    <filter id="insetType" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="-2" stdDeviation="1" flood-color="#000" flood-opacity=".85"/>
      <feDropShadow dx="0" dy="1" stdDeviation=".3" flood-color="#d2eeff" flood-opacity=".25"/>
    </filter>
    <clipPath id="feedCrop"><rect x="600" y="50" width="550" height="530" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0d141d"/>
  <rect width="1200" height="630" fill="url(#ambient)"/>

  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="72" y="204" font-size="118" font-weight="700" letter-spacing="-8" fill="url(#wordmark)" filter="url(#insetType)">archie<tspan fill="#92c9ed">.</tspan></text>
    <path d="M76 245h48" stroke="#8bcfff" stroke-width="2"/>
    <text x="72" y="321" fill="#edf5fc" font-size="51" font-weight="600" letter-spacing="-1.8">A different</text>
    <text x="72" y="380" fill="#edf5fc" font-size="51" font-weight="600" letter-spacing="-1.8">perspective.</text>
    <text x="76" y="434" fill="#9eb6c9" font-size="23">Posts worth keeping.</text>
    <text x="76" y="467" fill="#9eb6c9" font-size="23">A fresh view with every shuffle.</text>
    <path d="m80 531 5 5-5 5-5-5Z" fill="#a6d9ff"/>
    <text x="101" y="543" fill="#b9d0e2" font-size="21" letter-spacing="1">aggregate.mk</text>
  </g>

  <!-- A real feed capture; keep the file beside this SVG when exporting. -->
  <image href="archie-feed.png" x="600" y="50" width="550" height="530" preserveAspectRatio="xMidYMin meet" clip-path="url(#feedCrop)"/>
  <rect x="600.5" y="50.5" width="549" height="529" rx="11.5" fill="none" stroke="#90c8ef" stroke-opacity=".4"/>
</svg>
